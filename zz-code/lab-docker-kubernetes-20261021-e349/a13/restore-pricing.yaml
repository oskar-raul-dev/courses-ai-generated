# a13: la restauración de la base de pricing desde el respaldo más reciente, con la imagen del servidor y el PVC de los
# respaldos en solo lectura.
apiVersion: batch/v1
kind: Job
metadata: {name: postgres-restore-pricing, namespace: data}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: lab}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: restore
          image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - {name: PGHOST, value: postgres-0.postgres.data.svc.cluster.local}
            - {name: PGUSER, value: postgres}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-users, key: POSTGRES_PASSWORD}}
          command:
            - sh
            - -ec
            - |
              last=$(ls -d /backups/*/ | sort | tail -1)
              echo "restaurando desde $last"
              psql -c "CREATE DATABASE pricing OWNER pricing"
              psql -c "REVOKE ALL ON DATABASE pricing FROM PUBLIC"
              pg_restore -d pricing --exit-on-error "$last/pricing.dump"
              psql -d pricing -At -c "SELECT count(*) FROM prices"
          volumeMounts: [{name: backups, mountPath: /backups, readOnly: true}]
      volumes:
        - name: backups
          persistentVolumeClaim: {claimName: postgres-backups, readOnly: true}
