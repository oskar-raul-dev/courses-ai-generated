# a09: la misma imagen, dos despliegues con su marca en un ConfigMap montado.
apiVersion: v1
kind: ConfigMap
metadata: {name: storefront-ssr-brand, namespace: apps, labels: {a09: ssr}}
data: {brand: "Droguerías La Vecina"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront-ssr, namespace: apps, labels: {a09: ssr}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: storefront-ssr}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: storefront-ssr, app.kubernetes.io/part-of: lab, a09: ssr}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ssr
          image: lab/storefront-ssr:a09
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: BRAND_FILE, value: /etc/brand/brand}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: brand, mountPath: /etc/brand, readOnly: true}
      volumes:
        - name: brand
          configMap: {name: storefront-ssr-brand}
---
apiVersion: v1
kind: Service
metadata: {name: storefront-ssr, namespace: apps, labels: {a09: ssr}}
spec:
  selector: {app.kubernetes.io/name: storefront-ssr}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: storefront-ssr, namespace: apps, labels: {a09: ssr}}
spec:
  parentRefs: [{name: lab, namespace: gateway}]
  hostnames: ["ssr.localhost"]
  rules: [{backendRefs: [{name: storefront-ssr, port: 8080}]}]
---
