<h2>Activos</h2>

<a mat-raised-button color="primary" routerLink="/assets/new">
  <mat-icon>add</mat-icon>
  Nuevo activo
</a>

<ng-container *ngIf="state$ | async as state">
  <mat-progress-spinner *ngIf="state.loading" mode="indeterminate" diameter="32"></mat-progress-spinner>

  <p class="asset-list-error" *ngIf="state.error !== null">{{ state.error }}</p>

  <table mat-table [dataSource]="state.items" *ngIf="state.items.length > 0">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Identificador</th>
      <td mat-cell *matCellDef="let asset">{{ asset.id }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let asset">{{ asset.type }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let asset">{{ asset.description }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let asset">
        <a mat-icon-button [routerLink]="['/assets', asset.id, 'edit']" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <cc-empty-state
    *ngIf="!state.loading && state.items.length === 0 && state.error === null"
    icon="elevator"
    message="Todavía no hay activos registrados."
  ></cc-empty-state>
</ng-container>
