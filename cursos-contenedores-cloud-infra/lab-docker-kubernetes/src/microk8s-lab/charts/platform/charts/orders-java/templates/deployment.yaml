apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-orders-java
  labels:
    app: orders-java
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: orders-java
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: orders-java
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: orders-java
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.port }}
          # Las variables de entorno se generan iterando sobre el mapa
          # .Values.env con range. $key y $value son cada par del mapa.
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
