spring.application.name=clearinghouse
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/meridian}
# Sin esto, el driver manda cada fila de un batchUpdate como una sentencia aparte. Con
# esto, la reescribe como un INSERT de varias filas, que es lo que hace la versión Go. Es
# el primer ajuste que pone cualquier equipo que escribe en lote contra PostgreSQL.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.username=${DATABASE_USER:meridian}
spring.datasource.password=${DATABASE_PASSWORD:meridian}
spring.datasource.hikari.maximum-pool-size=20
# El esquema lo manda Flyway (el SQL compartido); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# El JobRepository de Spring Batch guarda sus tablas BATCH_* en la misma base:
# es parte de lo que Spring Batch da hecho, y se dice en el README.
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health,info,metrics
